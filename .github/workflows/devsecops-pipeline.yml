name: DevSecOps Pipeline - AgriGest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  VERSAO_NODE: 22   # node:sqlite exige Node 22.5+
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # 1) Qualidade: sintaxe, lint e testes (inclui os testes da Feature Flag)
  lint-and-test:
    name: Lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSAO_NODE }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Verificar sintaxe
        run: npm run check
      - name: Lint com ESLint
        run: npm run lint
      - name: Testes automatizados
        run: npm test

  # 2) Segurança (Shift-Left): as etapas são sequenciais. Se uma falhar,
  #    as seguintes NÃO executam (ordem: Secrets -> SAST -> SCA).
  security-scans:
    name: Scans de segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: segredos antigos também são detectados

      - name: Secret Scanning (TruffleHog)
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            git file:///repo --no-update --fail

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSAO_NODE }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      # SAST. Comando ORIGINAL: qualquer alerta (warning) reprova o pipeline.
      - name: SAST - Análise estática (ESLint Security)
        working-directory: backend
        run: npm run sast
        # Comando ALTERADO (demonstração da Seção 9): só mostra o relatório e não bloqueia.
        # run: npm run sast:report

      # SCA: falha se houver vulnerabilidade HIGH ou CRITICAL nas dependências de produção.
      - name: SCA - Dependências (npm audit)
        working-directory: backend
        run: npm run audit:deps

  # 3) Entrega: só roda se qualidade E segurança passaram (needs).
  build-scan-push:
    name: Build, Trivy e Push da imagem
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scans]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem Docker
        run: docker build -t agrigest-api:${{ github.sha }} .

      # Quality Gate da imagem: falha se houver HIGH/CRITICAL com correção disponível.
      - name: Escanear a imagem (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            agrigest-api:${{ github.sha }}
        # Se necessário (Seção 9), deixe só CRITICAL:  --severity CRITICAL

      - name: Subir o container e checar a saúde da API
        run: |
          docker run -d -p 3001:3001 -e JWT_SECRET=segredo_do_ci --name agrigest agrigest-api:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3001/api/health; then exit 0; fi
            sleep 2
          done
          docker logs agrigest
          exit 1

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker tag agrigest-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag agrigest-api:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
